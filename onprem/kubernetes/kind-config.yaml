# Clúster Kubernetes local de NubloPost (kind). Lo crea ./lab.sh up
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: nublopost
networking:
  # El API server solo escucha dentro de la VM. 127.0.0.1 ya es el valor por
  # defecto de kind; se deja explícito porque es un control del laboratorio.
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
nodes:
  # Un solo nodo, como el despliegue oficial de Kubernetes Goat en kind.
  # Imagen fijada por digest: la que kind v0.33.0 usa por defecto (Kubernetes v1.37.0).
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
