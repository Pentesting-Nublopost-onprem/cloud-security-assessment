# Cliente on-prem de la API de NubloPost: kubectl apply -k .
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nublopost-client

resources:
  - namespace.yaml
  - deployment.yaml

configMapGenerator:
  - name: hybrid-check
    files:
      - hybrid_check.py

# Credenciales de la API desde .env (no se versiona; plantilla en .env.example).
secretGenerator:
  - name: vampi-credentials
    envs:
      - .env
