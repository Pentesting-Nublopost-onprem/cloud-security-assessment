name: build-vampi

# Construye la imagen de VAmPI desde applications/vampi y la publica en GHCR.
# No toca Azure: solo necesita permiso para publicar paquetes.

on:
  push:
    branches: [main]
    paths:
      - "applications/vampi/**"
      - ".github/workflows/build-vampi.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-vampi
  cancel-in-progress: false

jobs:
  build:
    name: Imagen de VAmPI en GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Nombre de la imagen (GHCR exige minúsculas)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vampi" >> "$GITHUB_ENV"

      - name: Preparar Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: applications/vampi
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=VAmPI, API vulnerable a proposito (laboratorio NubloPost)
            org.opencontainers.image.licenses=MIT

      - name: Resumen
        run: |
          {
            echo "### Imagen publicada"
            echo
            echo "- \`${IMAGE}:${GITHUB_SHA}\`"
            echo "- \`${IMAGE}:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
